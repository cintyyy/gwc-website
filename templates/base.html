<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MVHS GWC{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        <div class="container">
            <nav>
                <a href="/" class="logo-link" style="text-decoration: none; color: inherit;">
                    <div class="logo">
                        <img src="{{ url_for('static', filename='images/___.png') }}" alt="logo" class="logo-image">
                        <span class="logo-text"></span>
                    </di
                </a>
                <ul class="nav-links">
                    <li><a href="/"></a></li>
                    <!-- more li tags here -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; 2025 MVHS GWC. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="https://instagram.com/mvhs.gwc" target="_blank"><i class="fa-brands fa-square-instagram"></i></a>
            </div>
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
